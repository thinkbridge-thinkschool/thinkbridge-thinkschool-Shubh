<section class="quotes-page">
  <header class="page-header">
    <h1 class="page-header__title">Quotes</h1>
    <p class="page-header__subtitle">
      Browse quotes from the QuotesApi backend and select one to see its full details.
    </p>
  </header>

  <div class="quotes-layout">
    <div class="quotes-layout__list">
      <app-quotes-list
        [selectedId]="selectedQuoteId()"
        (select)="onSelect($event)"
      />
    </div>

    <div class="quotes-layout__detail">
      <app-quote-detail [quoteId]="selectedQuoteId()" />
    </div>
  </div>
</section>
