<div class="auth-screen">
  <div class="auth-screen__glow" aria-hidden="true"></div>

  <div class="auth-screen__content">
    <div class="auth-brand">
      <span class="auth-brand__mark" aria-hidden="true">Q</span>
      <h1 class="auth-brand__name">QuotesApi</h1>
    </div>

    <form class="card auth-card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="auth-card__header">
        <h2 class="auth-card__title">Welcome back</h2>
        <p class="auth-card__subtitle">Sign in to create and manage quotes.</p>
      </div>

      <p class="hint">Use a seeded QuotesApi account, e.g. test&#64;example.com.</p>

      <div class="field">
        <label class="field__label" for="email">Email</label>
        <input
          id="email"
          #emailInput
          class="input"
          type="email"
          formControlName="email"
          autocomplete="username"
          [attr.aria-invalid]="fieldError('email') ? true : null"
          [attr.aria-describedby]="describedBy('email')"
        />
        @if (fieldError('email'); as message) {
          <p id="email-error" class="field-error">{{ message }}</p>
        }
      </div>

      <div class="field">
        <label class="field__label" for="password">Password</label>
        <input
          id="password"
          #passwordInput
          class="input"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          [attr.aria-invalid]="fieldError('password') ? true : null"
          [attr.aria-describedby]="describedBy('password')"
        />
        @if (fieldError('password'); as message) {
          <p id="password-error" class="field-error">{{ message }}</p>
        }
      </div>

      <button type="submit" class="btn btn--primary btn--block" [disabled]="auth.loginPending()">
        @switch (auth.loginPending()) {
          @case (true) {
            <span class="spinner spinner--inline" aria-hidden="true"></span>
            Signing in…
          }
          @default {
            Log in
          }
        }
      </button>

      @if (auth.loginError()) {
        <p class="alert alert--error" role="alert">{{ auth.loginError() }}</p>
      }
    </form>
  </div>
</div>
