<div class="quotes-layout" [class.quotes-layout--detail]="hasSelection()">
  <!-- Column 2: the quote list. -->
  <app-quotes-list class="quotes-layout__list" />

  <!-- Column 3: the detail panel, filled by the child route (QuotesEmpty at
       /quotes, QuoteDetail at /quotes/:id). -->
  <section class="quotes-layout__detail" aria-label="Quote details">
    <router-outlet />
  </section>
</div>
